name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TechMove.slnx

      - name: Build
        run: dotnet build TechMove.slnx --no-restore -c Release

      - name: Test
        run: dotnet test TechMove.Tests/TechMove.Tests.csproj --no-build -c Release --filter "Category!=Live" --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

  docker-build:
    if: ${{ hashFiles('docker-compose.yml', '.env.example') != '' }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Build Docker Compose services
        run: docker compose build
